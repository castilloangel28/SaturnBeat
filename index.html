<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SaturnBeat</title>

  <!-- Meta Tags PWA (Comportamiento de app nativa/APK) -->
  <meta name="theme-color" content="#ff0055">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SaturnBeat">
  <link rel="apple-touch-icon" href="https://img.icons8.com/neon/512/spider.png">

  <!-- Web App Manifest Inline -->
  <link rel="manifest" href='data:application/json,{"name":"SaturnBeat","short_name":"SaturnBeat","start_url":".","display":"standalone","orientation":"portrait","background_color":"#0b0c10","theme_color":"#ff0055","icons":[{"src":"https://img.icons8.com/neon/192/spider.png","sizes":"192x192","type":"image/png"},{"src":"https://img.icons8.com/neon/512/spider.png","sizes":"512x512","type":"image/png"}]}'>

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --spider-red: #ff0055;
      --spider-blue: #00e5ff;
      --spider-dark: #0b0c10;
      --spider-card: rgba(18, 22, 36, 0.85);
      --font-title: 'Orbitron', sans-serif;
      --font-body: 'Rajdhani', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--spider-dark);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #fff;
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-image 0.5s ease;
      overflow-x: hidden;
    }

    /* Malla de Telaraña Neón Animada */
    .web-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: 
        radial-gradient(circle at 50% 50%, rgba(0, 229, 255, 0.08) 0%, transparent 70%),
        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(0, 229, 255, 0.03) 40px, rgba(0, 229, 255, 0.03) 41px),
        repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0, 229, 255, 0.03) 40px, rgba(0, 229, 255, 0.03) 41px);
      pointer-events: none;
      z-index: 1;
      animation: pulseWeb 8s infinite alternate ease-in-out;
    }

    @keyframes pulseWeb {
      0% { opacity: 0.5; }
      100% { opacity: 1; filter: drop-shadow(0 0 15px rgba(255,0,85,0.2)); }
    }

    /* Layout Principal */
    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 2;
      padding: 20px;
    }

    .glass-card {
      background: var(--spider-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 229, 255, 0.2);
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.2);
      padding: 22px;
      margin-bottom: 20px;
      position: relative;
      animation: floatCard 4s ease-in-out infinite alternate;
    }

    @keyframes floatCard {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-4px); }
    }

    /* PIN Auth Screen */
    #auth-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--spider-dark);
      z-index: 999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .pin-display {
      letter-spacing: 12px;
      font-size: 2rem;
      font-family: var(--font-title);
      margin: 15px 0;
      color: var(--spider-blue);
      text-shadow: 0 0 12px var(--spider-blue);
      border-bottom: 2px solid var(--spider-red);
      padding: 10px;
      min-height: 55px;
    }

    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .num-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 229, 255, 0.3);
      color: #fff;
      font-size: 1.4rem;
      padding: 16px;
      border-radius: 12px;
      font-family: var(--font-title);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .num-btn:active {
      background: var(--spider-red);
      box-shadow: 0 0 20px var(--spider-red);
      transform: scale(0.92);
    }

    /* Modal Frases */
    #quote-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(12px);
      z-index: 998;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .quote-box {
      text-align: center;
      border: 1px solid var(--spider-red);
      box-shadow: 0 0 30px var(--spider-red);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .quote-text {
      font-size: 1.2rem;
      font-style: italic;
      margin-bottom: 12px;
      color: #e0e0e0;
      line-height: 1.4;
    }

    .quote-author {
      font-family: var(--font-title);
      color: var(--spider-blue);
      text-shadow: 0 0 8px var(--spider-blue);
      font-size: 0.85rem;
    }

    /* Header & Controles */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .theme-selector {
      display: flex;
      gap: 8px;
    }

    .bg-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #fff;
      cursor: pointer;
    }

    /* Navegación por Pestañas */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 4px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 229, 255, 0.3);
      color: #888;
      font-family: var(--font-title);
      font-size: 0.75rem;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }

    .tab-btn.active {
      color: #fff;
      background: rgba(255, 0, 85, 0.25);
      border-color: var(--spider-red);
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
    }

    /* Inputs y Formularios */
    .input-group {
      margin-bottom: 12px;
    }

    input[type="number"] {
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(0, 229, 255, 0.4);
      border-radius: 10px;
      padding: 12px;
      color: #fff;
      font-family: var(--font-title);
      font-size: 1.1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="number"]:focus {
      border-color: var(--spider-red);
      box-shadow: 0 0 12px rgba(255, 0, 85, 0.5);
    }

    /* Pantallas de Resultado Interactivas */
    .result-box {
      margin-top: 15px;
      padding: 15px;
      background: rgba(0, 229, 255, 0.06);
      border: 1px solid var(--spider-blue);
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
      transition: all 0.3s ease;
    }

    .result-value {
      font-family: var(--font-title);
      font-size: 2rem;
      color: var(--spider-blue);
      text-shadow: 0 0 12px var(--spider-blue);
    }

    .result-detail {
      font-size: 0.85rem;
      color: #aaa;
      margin-top: 4px;
    }

    /* UI del Cronómetro */
    .timer-display {
      font-family: var(--font-title);
      font-size: 2.8rem;
      color: var(--spider-blue);
      text-shadow: 0 0 20px var(--spider-blue);
      text-align: center;
      margin: 15px 0;
      letter-spacing: 2px;
      transition: color 0.3s, text-shadow 0.3s;
    }

    .timer-display.warning {
      color: #ffcc00;
      text-shadow: 0 0 20px #ffcc00;
      animation: pulseWarning 1s infinite alternate;
    }

    .timer-display.negative {
      color: var(--spider-red);
      text-shadow: 0 0 25px var(--spider-red);
      animation: pulseNegative 0.5s infinite alternate;
    }

    @keyframes pulseWarning { 0% { opacity: 0.7; } 100% { opacity: 1; } }
    @keyframes pulseNegative { 0% { transform: scale(0.98); } 100% { transform: scale(1.02); } }

    .timer-controls {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-timer {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-family: var(--font-title);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-start { background: linear-gradient(90deg, #00e5ff, #0088cc); color: #000; box-shadow: 0 0 10px rgba(0,229,255,0.4); }
    .btn-pause { background: linear-gradient(90deg, #ffcc00, #ff8800); color: #000; box-shadow: 0 0 10px rgba(255,204,0,0.4); }
    .btn-reset { background: linear-gradient(90deg, var(--spider-red), #990033); color: #fff; box-shadow: 0 0 10px rgba(255,0,85,0.4); }

    .btn-timer:active { transform: scale(0.95); }

    /* SVG Spider Logotipos */
    .spider-icon {
      width: 45px; height: 45px;
      fill: var(--spider-red);
      filter: drop-shadow(0 0 8px var(--spider-red));
    }
    .spider-icon-blue {
      width: 35px; height: 35px;
      fill: var(--spider-blue);
      filter: drop-shadow(0 0 8px var(--spider-blue));
    }
    .center-icon { display: flex; justify-content: center; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div class="web-overlay"></div>

  <!-- Pantalla de Login (PIN) -->
  <div id="auth-screen">
    <div class="glass-card" style="width:100%; max-width:360px; text-align:center;">
      <div class="center-icon">
        <svg class="spider-icon" viewBox="0 0 24 24">
          <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12C20,13.7 19.47,15.28 18.57,16.57L16.27,13.12C16.73,12.44 17,11.63 17,10.75C17,8.13 14.87,6 12.25,6C11.5,6 10.79,6.17 10.16,6.47L8.43,3.88C9.5,3.32 10.71,3 12,3M12,7.5C13.8,7.5 15.25,8.95 15.25,10.75C15.25,11.5 15,12.18 14.57,12.72L12,8.86L9.43,12.72C9,12.18 8.75,11.5 8.75,10.75C8.75,8.95 10.2,7.5 12,7.5M5.43,7.43L7.16,10.03C6.73,10.71 6.5,11.5 6.5,12.25C6.5,14.87 8.63,17 11.25,17C12,17 12.71,16.83 13.34,16.53L15.07,19.12C14,19.68 12.79,20 11.5,20A8,8 0 0,1 3.5,12C3.5,10.3 4.03,8.72 4.93,7.43M12,14.5A2.25,2.25 0 0,1 9.75,12.25C9.75,11.5 10,10.82 10.43,10.28L12,12.64L13.57,10.28C14,10.82 14.25,11.5 14.25,12.25A2.25,2.25 0 0,1 12,14.5Z"/>
        </svg>
      </div>
      <div class="pin-display" id="pin-display">------</div>
      <div class="numpad">
        <button class="num-btn" onclick="appendPin('1')">1</button>
        <button class="num-btn" onclick="appendPin('2')">2</button>
        <button class="num-btn" onclick="appendPin('3')">3</button>
        <button class="num-btn" onclick="appendPin('4')">4</button>
        <button class="num-btn" onclick="appendPin('5')">5</button>
        <button class="num-btn" onclick="appendPin('6')">6</button>
        <button class="num-btn" onclick="appendPin('7')">7</button>
        <button class="num-btn" onclick="appendPin('8')">8</button>
        <button class="num-btn" onclick="appendPin('9')">9</button>
        <button class="num-btn" onclick="clearPin()">C</button>
        <button class="num-btn" onclick="appendPin('0')">0</button>
        <button class="num-btn" onclick="checkPin()">
          <svg style="width:20px;height:20px;fill:var(--spider-blue)" viewBox="0 0 24 24"><path d="M21,7L9,19L3.5,13.5L4.91,12.09L9,16.17L19.59,5.59L21,7Z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Modal Frase Aleatoria -->
  <div id="quote-modal">
    <div class="glass-card quote-box">
      <div class="center-icon">
        <svg class="spider-icon-blue" viewBox="0 0 24 24">
          <path d="M12,2L15,8L21,9L16.5,14L18,20L12,17L6,20L7.5,14L3,9L9,8L12,2Z"/>
        </svg>
      </div>
      <div class="quote-text" id="quote-text"></div>
      <div class="quote-author" id="quote-author"></div>
      <button class="btn-timer btn-start" style="margin-top:20px; width:100%;" onclick="closeQuote()">ENTRAR</button>
    </div>
  </div>

  <!-- Contenedor Principal de la App -->
  <div class="app-container">
    <header>
      <div style="display:flex; align-items:center; gap:8px;">
        <svg class="spider-icon" style="width:32px; height:32px;" viewBox="0 0 24 24">
          <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12C20,13.7 19.47,15.28 18.57,16.57L16.27,13.12C16.73,12.44 17,11.63 17,10.75C17,8.13 14.87,6 12.25,6C11.5,6 10.79,6.17 10.16,6.47L8.43,3.88C9.5,3.32 10.71,3 12,3"/>
        </svg>
        <svg class="spider-icon-blue" style="width:24px; height:24px;" viewBox="0 0 24 24">
          <path d="M12,2L15,8L21,9L16.5,14L18,20L12,17L6,20L7.5,14L3,9L9,8L12,2Z"/>
        </svg>
      </div>
      
      <div class="theme-selector">
        <div class="bg-btn" style="background: #0b0c10;" onclick="setBg('dark')"></div>
        <div class="bg-btn" style="background: linear-gradient(135deg, #1f0010, #001122);" onclick="setBg('neon')"></div>
        <div class="bg-btn" style="background: linear-gradient(135deg, #000000, #4a0000);" onclick="setBg('red')"></div>
      </div>
    </header>

    <!-- Menú de Pestañas -->
    <div class="tabs">
      <div class="tab-btn active" id="tab1-btn" onclick="switchTab(1)">100%</div>
      <div class="tab-btn" id="tab2-btn" onclick="switchTab(2)">% EFICIENCIA</div>
      <div class="tab-btn" id="tab3-btn" onclick="switchTab(3)">CRONÓMETRO</div>
    </div>

    <!-- Opción 1: Ritmo 100% -->
    <div id="opt1" class="glass-card">
      <div class="input-group">
        <input type="number" id="meta1" placeholder="META CARGA" oninput="calcOpt1()">
      </div>
      <div class="input-group">
        <input type="number" id="docenas1" placeholder="DOCENAS HECHAS" oninput="calcOpt1()">
      </div>
      <div class="result-box" id="res1">
        <div class="result-value" id="res1-time">0h 00m</div>
        <div class="result-detail" id="res1-detail">Ingresa datos para calcular</div>
      </div>
    </div>

    <!-- Opción 2: Ritmo por Eficiencia -->
    <div id="opt2" class="glass-card" style="display:none;">
      <div class="input-group">
        <input type="number" id="meta2" placeholder="META CARGA" oninput="calcOpt2()">
      </div>
      <div class="input-group">
        <input type="number" id="docenas2" placeholder="DOCENAS HECHAS" oninput="calcOpt2()">
      </div>
      <div class="input-group">
        <input type="number" id="ritmo2" placeholder="% RITMO DESEADO (ej. 105, 85)" oninput="calcOpt2()">
      </div>
      <div class="result-box" id="res2">
        <div class="result-value" id="res2-time">0h 00m</div>
        <div class="result-detail" id="res2-detail">Ingresa datos para calcular</div>
      </div>
    </div>

    <!-- Opción 3: Cronómetro Regresivo -->
    <div id="opt3" class="glass-card" style="display:none;">
      <div class="input-group">
        <input type="number" id="meta3" placeholder="META CARGA">
      </div>
      <div class="input-group">
        <input type="number" id="docenas3" placeholder="DOCENAS HECHAS">
      </div>
      <div class="input-group">
        <input type="number" id="ritmo3" placeholder="% RITMO DESEADO (ej. 105, 85)">
      </div>

      <div class="timer-display" id="timer-display">00:00:00</div>

      <div class="timer-controls">
        <button class="btn-timer btn-start" onclick="startTimer()">INICIAR</button>
        <button class="btn-timer btn-pause" onclick="pauseTimer()">PAUSAR</button>
        <button class="btn-timer btn-reset" onclick="resetTimer()">DETENER</button>
      </div>
    </div>
  </div>

  <script>
    // Registra el Service Worker de la PWA
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
        self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob));
    }

    // Frases de Spider-Man
    const quotes = [
      { text: "Son las decisiones las que nos hacen ser quienes somos. Y siempre podemos optar por hacer lo correcto.", author: "Spiderman" },
      { text: "Tenemos que ser más grandes que lo que nos hace sufrir.", author: "Spiderman" },
      { text: "A veces la vida apesta, ¡pero siempre vale la pena vivirla!", author: "Spiderman" },
      { text: "¿Sabes qué es más genial que la magia? Matemáticas.", author: "Spiderman" },
      { text: "Aquel que ayuda a los demás, simplemente porque debe y porque es lo correcto, es sin duda un verdadero superhéroe.", author: "Spiderman" },
      { text: "Eres mucho más fuerte de lo que crees. Confía en mí.", author: "Spiderman" },
      { text: "Independientemente de lo que me depare esta vida nunca olvidaré estas palabras: un gran poder conlleva una gran responsabilidad. Esa es mi virtud y mi maldición.", author: "Spiderman" },
      { text: "Somos quienes elegimos ser... ¡Así que elige!", author: "Spiderman" },
      { text: "Lo más difícil de la vida es que no siempre se puede salvar a todos.", author: "Spiderman" },
      { text: "A veces, para hacer lo correcto, tienes que ser firme y renunciar a lo que más deseas. Incluso a tus sueños.", author: "Spiderman" }
    ];

    // Control PIN
    let currentPin = "";
    const targetPin = "7550822";

    function appendPin(num) {
      if (currentPin.length < 7) {
        currentPin += num;
        updatePinDisplay();
      }
    }

    function clearPin() {
      currentPin = "";
      updatePinDisplay();
    }

    function updatePinDisplay() {
      document.getElementById("pin-display").textContent = "*".repeat(currentPin.length) || "------";
    }

    function checkPin() {
      if (currentPin === targetPin) {
        document.getElementById("auth-screen").style.display = "none";
        showRandomQuote();
      } else {
        alert("Clave incorrecta");
        clearPin();
      }
    }

    function showRandomQuote() {
      const random = quotes[Math.floor(Math.random() * quotes.length)];
      document.getElementById("quote-text").textContent = `"${random.text}"`;
      document.getElementById("quote-author").textContent = `- ${random.author}`;
      document.getElementById("quote-modal").style.display = "flex";
    }

    function closeQuote() {
      document.getElementById("quote-modal").style.display = "none";
    }

    // Navegación de Pestañas
    function switchTab(tab) {
      [1, 2, 3].forEach(i => {
        document.getElementById(`opt${i}`).style.display = (i === tab) ? "block" : "none";
        document.getElementById(`tab${i}-btn`).classList.toggle("active", i === tab);
      });
    }

    // Temas de Fondo
    function setBg(type) {
      if (type === 'dark') {
        document.body.style.backgroundImage = 'none';
        document.body.style.backgroundColor = '#0b0c10';
      } else if (type === 'neon') {
        document.body.style.backgroundImage = 'radial-gradient(circle at 50% 50%, #1f0010 0%, #001122 100%)';
      } else if (type === 'red') {
        document.body.style.backgroundImage = 'linear-gradient(135deg, #000000 0%, #4a0000 100%)';
      }
    }

    // Cálculos en Tiempo Real
    function calcOpt1() {
      const meta = parseFloat(document.getElementById("meta1").value);
      const docenas = parseFloat(document.getElementById("docenas1").value);

      if (!meta || !docenas) {
        document.getElementById("res1-time").textContent = "0h 00m";
        document.getElementById("res1-detail").textContent = "Ingresa datos para calcular";
        return;
      }

      const ritmo100 = meta / 11;
      const horasTotales = docenas / ritmo100;
      const horasEnteras = Math.floor(horasTotales);
      const minutos = Math.round((horasTotales - horasEnteras) * 60);

      document.getElementById("res1-time").textContent = `${horasEnteras}h ${minutos < 10 ? '0' : ''}${minutos}m`;
      document.getElementById("res1-detail").textContent = `${horasTotales.toFixed(3)} horas (100% Ritmo)`;
    }

    function calcOpt2() {
      const meta = parseFloat(document.getElementById("meta2").value);
      const docenas = parseFloat(document.getElementById("docenas2").value);
      const ritmoInput = parseFloat(document.getElementById("ritmo2").value);

      if (!meta || !docenas || !ritmoInput) {
        document.getElementById("res2-time").textContent = "0h 00m";
        document.getElementById("res2-detail").textContent = "Ingresa datos para calcular";
        return;
      }

      const factorRitmo = ritmoInput / 100;
      const ritmo100 = meta / 11;
      const horasTotales = (docenas / ritmo100) / factorRitmo;
      const horasEnteras = Math.floor(horasTotales);
      const minutos = Math.round((horasTotales - horasEnteras) * 60);

      document.getElementById("res2-time").textContent = `${horasEnteras}h ${minutos < 10 ? '0' : ''}${minutos}m`;
      document.getElementById("res2-detail").textContent = `${horasTotales.toFixed(3)} horas al ${ritmoInput}%`;
    }

    // Cronómetro Regresivo Completo
    let timerInterval = null;
    let totalSeconds = 0;
    let alertSoundPlayed = false;
    let isVibrating = false;

    // Generador de audio Spider-Man mediante Synthesizer Web Audio API
    function playSpiderTone() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime + i * 0.15);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.15 + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + i * 0.15);
          osc.stop(audioCtx.currentTime + i * 0.15 + 0.3);
        });
      } catch (e) {
        console.log("Audio no disponible");
      }
    }

    function startTimer() {
      if (timerInterval) return;

      if (totalSeconds === 0) {
        const meta = parseFloat(document.getElementById("meta3").value);
        const docenas = parseFloat(document.getElementById("docenas3").value);
        const ritmoInput = parseFloat(document.getElementById("ritmo3").value);

        if (!meta || !docenas || !ritmoInput) {
          alert("Ingresa Meta, Docenas y Ritmo % para iniciar el cronómetro.");
          return;
        }

        const factorRitmo = ritmoInput / 100;
        const ritmo100 = meta / 11;
        const horasTotales = (docenas / ritmo100) / factorRitmo;
        totalSeconds = Math.round(horasTotales * 3600);
      }

      alertSoundPlayed = false;

      timerInterval = setInterval(() => {
        totalSeconds--;

        updateTimerUI();

        // Alerta sonora cuando queden 5 minutos (300 segundos)
        if (totalSeconds === 300 && !alertSoundPlayed) {
          playSpiderTone();
          alertSoundPlayed = true;
        }

        // Al llegar a 0 o menor: vibración persistente
        if (totalSeconds <= 0) {
          if ('vibrate' in navigator) {
            navigator.vibrate([400, 200, 400]);
          }
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      if ('vibrate' in navigator) navigator.vibrate(0);
    }

    function resetTimer() {
      pauseTimer();
      totalSeconds = 0;
      alertSoundPlayed = false;
      const display = document.getElementById("timer-display");
      display.textContent = "00:00:00";
      display.className = "timer-display";
    }

    function updateTimerUI() {
      const display = document.getElementById("timer-display");
      const isNegative = totalSeconds < 0;
      const absSecs = Math.abs(totalSeconds);

      const h = Math.floor(absSecs / 3600);
      const m = Math.floor((absSecs % 3600) / 60);
      const s = absSecs % 60;

      const format = `${isNegative ? '-' : ''}${h < 10 ? '0' : ''}${h}:${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
      display.textContent = format;

      if (isNegative) {
        display.className = "timer-display negative";
      } else if (totalSeconds <= 300) {
        display.className = "timer-display warning";
      } else {
        display.className = "timer-display";
      }
    }
  </script>
</body>
