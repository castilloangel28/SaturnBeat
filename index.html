<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaturnBeat</title>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#0d0f17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SaturnBeat">
  
  <!-- Manifest Inline (Data URI) -->
  <link rel="manifest" href='data:application/json,{"name":"SaturnBeat","short_name":"SaturnBeat","start_url":".","display":"standalone","background_color":"#0d0f17","theme_color":"#0d0f17","icons":[{"src":"https://img.icons8.com/neon/192/spider.png","sizes":"192x192","type":"image/png"},{"src":"https://img.icons8.com/neon/512/spider.png","sizes":"512x512","type":"image/png"}]}'>

  <!-- Fuentes e Iconos -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --spider-red: #ff0055;
      --spider-blue: #00e5ff;
      --spider-dark: #0b0c10;
      --spider-card: rgba(18, 22, 36, 0.75);
      --spider-glass: rgba(255, 255, 255, 0.03);
      --font-title: 'Orbitron', sans-serif;
      --font-body: 'Rajdhani', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--spider-dark);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #fff;
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-image 0.5s ease;
      overflow-x: hidden;
    }

    /* Malla de Telaraña Neón en Background */
    .web-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: 
        radial-gradient(circle at 50% 50%, rgba(0, 229, 255, 0.05) 0%, transparent 70%),
        radial-gradient(circle at 10% 10%, rgba(255, 0, 85, 0.08) 0%, transparent 50%),
        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(0, 229, 255, 0.03) 40px, rgba(0, 229, 255, 0.03) 41px),
        repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0, 229, 255, 0.03) 40px, rgba(0, 229, 255, 0.03) 41px);
      pointer-events: none;
      z-index: 1;
    }

    /* Modales y Contenedores */
    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 2;
      padding: 20px;
    }

    .glass-card {
      background: var(--spider-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 229, 255, 0.2);
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.2), inset 0 0 15px rgba(0, 229, 255, 0.1);
      padding: 25px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      background: linear-gradient(45deg, var(--spider-red), transparent, var(--spider-blue));
      z-index: -1;
      border-radius: 22px;
      opacity: 0.3;
    }

    /* UI Login (PIN Gate) */
    #auth-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--spider-dark);
      z-index: 999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-box {
      text-align: center;
      width: 100%;
      max-width: 360px;
    }

    .pin-display {
      letter-spacing: 12px;
      font-size: 2rem;
      font-family: var(--font-title);
      margin: 20px 0;
      color: var(--spider-blue);
      text-shadow: 0 0 10px var(--spider-blue);
      border-bottom: 2px solid var(--spider-red);
      padding: 10px;
      min-height: 60px;
    }

    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .num-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 229, 255, 0.3);
      color: #fff;
      font-size: 1.5rem;
      padding: 18px;
      border-radius: 12px;
      font-family: var(--font-title);
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      transition: all 0.2s;
    }

    .num-btn:active {
      background: var(--spider-red);
      box-shadow: 0 0 15px var(--spider-red);
      transform: scale(0.95);
    }

    /* Modal Frase */
    #quote-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      z-index: 998;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .quote-box {
      text-align: center;
      border: 1px solid var(--spider-red);
      box-shadow: 0 0 30px var(--spider-red);
    }

    .quote-text {
      font-size: 1.3rem;
      font-style: italic;
      margin-bottom: 15px;
      color: #e0e0e0;
      line-height: 1.4;
    }

    .quote-author {
      font-family: var(--font-title);
      color: var(--spider-blue);
      text-shadow: 0 0 8px var(--spider-blue);
      text-transform: uppercase;
      font-size: 0.9rem;
    }

    /* Header & Controles */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .theme-selector {
      display: flex;
      gap: 8px;
    }

    .bg-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #fff;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(255,255,255,0.5);
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 5px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 229, 255, 0.3);
      color: #888;
      font-family: var(--font-title);
      font-size: 0.8rem;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
    }

    .tab-btn.active {
      color: #fff;
      background: rgba(255, 0, 85, 0.2);
      border-color: var(--spider-red);
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
    }

    /* Forms & Inputs */
    .input-group {
      margin-bottom: 15px;
    }

    input[type="number"] {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 229, 255, 0.4);
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      font-family: var(--font-title);
      font-size: 1.1rem;
      outline: none;
      box-shadow: inset 0 0 5px rgba(0, 229, 255, 0.2);
      transition: border-color 0.3s;
    }

    input[type="number"]:focus {
      border-color: var(--spider-red);
      box-shadow: inset 0 0 8px rgba(255, 0, 85, 0.4), 0 0 8px rgba(255, 0, 85, 0.3);
    }

    .action-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, var(--spider-red), #b3003b);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: var(--font-title);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
      transition: all 0.2s;
      margin-top: 10px;
    }

    .action-btn:active {
      transform: scale(0.98);
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.8);
    }

    /* Result Display */
    .result-box {
      margin-top: 20px;
      padding: 15px;
      background: rgba(0, 229, 255, 0.05);
      border: 1px solid var(--spider-blue);
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
      display: none;
    }

    .result-value {
      font-family: var(--font-title);
      font-size: 1.8rem;
      color: var(--spider-blue);
      text-shadow: 0 0 10px var(--spider-blue);
      margin-top: 5px;
    }

    .result-detail {
      font-size: 0.9rem;
      color: #aaa;
      margin-top: 5px;
    }

    /* SVG Spider Logotipos Integrados sin texto */
    .spider-icon {
      width: 50px;
      height: 50px;
      fill: var(--spider-red);
      filter: drop-shadow(0 0 6px var(--spider-red));
    }
    
    .spider-icon-blue {
      width: 40px;
      height: 40px;
      fill: var(--spider-blue);
      filter: drop-shadow(0 0 6px var(--spider-blue));
    }

    .center-icon {
      display: flex;
      justify-content: center;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="web-overlay"></div>

  <!-- Pantalla de Login (PIN) -->
  <div id="auth-screen">
    <div class="glass-card auth-box">
      <div class="center-icon">
        <svg class="spider-icon" viewBox="0 0 24 24">
          <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12C20,13.7 19.47,15.28 18.57,16.57L16.27,13.12C16.73,12.44 17,11.63 17,10.75C17,8.13 14.87,6 12.25,6C11.5,6 10.79,6.17 10.16,6.47L8.43,3.88C9.5,3.32 10.71,3 12,3M12,7.5C13.8,7.5 15.25,8.95 15.25,10.75C15.25,11.5 15,12.18 14.57,12.72L12,8.86L9.43,12.72C9,12.18 8.75,11.5 8.75,10.75C8.75,8.95 10.2,7.5 12,7.5M5.43,7.43L7.16,10.03C6.73,10.71 6.5,11.5 6.5,12.25C6.5,14.87 8.63,17 11.25,17C12,17 12.71,16.83 13.34,16.53L15.07,19.12C14,19.68 12.79,20 11.5,20A8,8 0 0,1 3.5,12C3.5,10.3 4.03,8.72 4.93,7.43M12,14.5A2.25,2.25 0 0,1 9.75,12.25C9.75,11.5 10,10.82 10.43,10.28L12,12.64L13.57,10.28C14,10.82 14.25,11.5 14.25,12.25A2.25,2.25 0 0,1 12,14.5Z"/>
        </svg>
      </div>
      <div class="pin-display" id="pin-display">------</div>
      <div class="numpad">
        <button class="num-btn" onclick="appendPin('1')">1</button>
        <button class="num-btn" onclick="appendPin('2')">2</button>
        <button class="num-btn" onclick="appendPin('3')">3</button>
        <button class="num-btn" onclick="appendPin('4')">4</button>
        <button class="num-btn" onclick="appendPin('5')">5</button>
        <button class="num-btn" onclick="appendPin('6')">6</button>
        <button class="num-btn" onclick="appendPin('7')">7</button>
        <button class="num-btn" onclick="appendPin('8')">8</button>
        <button class="num-btn" onclick="appendPin('9')">9</button>
        <button class="num-btn" onclick="clearPin()">C</button>
        <button class="num-btn" onclick="appendPin('0')">0</button>
        <button class="num-btn" onclick="checkPin()">
          <svg style="width:20px;height:20px;fill:var(--spider-blue)" viewBox="0 0 24 24"><path d="M21,7L9,19L3.5,13.5L4.91,12.09L9,16.17L19.59,5.59L21,7Z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Modal Frase Aleatoria -->
  <div id="quote-modal">
    <div class="glass-card quote-box">
      <div class="center-icon">
        <svg class="spider-icon-blue" viewBox="0 0 24 24">
          <path d="M12,2L15,8L21,9L16.5,14L18,20L12,17L6,20L7.5,14L3,9L9,8L12,2Z"/>
        </svg>
      </div>
      <div class="quote-text" id="quote-text"></div>
      <div class="quote-author" id="quote-author"></div>
      <button class="action-btn" style="margin-top:20px;" onclick="closeQuote()">ENTRAR</button>
    </div>
  </div>

  <!-- Interfaz Principal App -->
  <div class="app-container">
    <header>
      <!-- Logo sin palabras -->
      <div style="display:flex; align-items:center; gap:10px;">
        <svg class="spider-icon" style="width:35px; height:35px;" viewBox="0 0 24 24">
          <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12C20,13.7 19.47,15.28 18.57,16.57L16.27,13.12C16.73,12.44 17,11.63 17,10.75C17,8.13 14.87,6 12.25,6C11.5,6 10.79,6.17 10.16,6.47L8.43,3.88C9.5,3.32 10.71,3 12,3"/>
        </svg>
        <svg class="spider-icon-blue" style="width:25px; height:25px;" viewBox="0 0 24 24">
          <path d="M12,2L15,8L21,9L16.5,14L18,20L12,17L6,20L7.5,14L3,9L9,8L12,2Z"/>
        </svg>
      </div>
      
      <!-- Selector de Fondos -->
      <div class="theme-selector">
        <div class="bg-btn" style="background: #0d0f17;" onclick="setBg('dark')"></div>
        <div class="bg-btn" style="background: linear-gradient(135deg, #1f0010, #001122);" onclick="setBg('neon')"></div>
        <div class="bg-btn" style="background: linear-gradient(135deg, #000000, #4a0000);" onclick="setBg('red')"></div>
      </div>
    </header>

    <!-- Navegación por pestañas -->
    <div class="tabs">
      <div class="tab-btn active" id="tab1-btn" onclick="switchTab(1)">
        <svg style="width:16px;height:16px;fill:currentColor;vertical-align:middle;" viewBox="0 0 24 24"><path d="M12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2M12.5,7V12.25L17,14.92L16.25,16.15L11,13V7H12.5Z"/></svg>
        100%
      </div>
      <div class="tab-btn" id="tab2-btn" onclick="switchTab(2)">
        <svg style="width:16px;height:16px;fill:currentColor;vertical-align:middle;" viewBox="0 0 24 24"><path d="M16,6L18.29,8.29L13.41,13.17L9.41,9.17L2,16.59L3.41,18L9.41,12L13.41,16L19.71,9.71L22,12V6H16Z"/></svg>
        % EFICIENCIA
      </div>
    </div>

    <!-- Opción 1: Ritmo 100% -->
    <div id="opt1" class="glass-card">
      <div class="input-group">
        <input type="number" id="meta1" placeholder="META CARGA">
      </div>
      <div class="input-group">
        <input type="number" id="docenas1" placeholder="DOCENAS HECHAS">
      </div>
      <button class="action-btn" onclick="calcOpt1()">CALCULAR</button>

      <div class="result-box" id="res1">
        <div class="result-value" id="res1-time">0h 0m</div>
        <div class="result-detail" id="res1-detail">0 horas exactas</div>
      </div>
    </div>

    <!-- Opción 2: Ritmo por Eficiencia -->
    <div id="opt2" class="glass-card" style="display:none;">
      <div class="input-group">
        <input type="number" id="meta2" placeholder="META CARGA">
      </div>
      <div class="input-group">
        <input type="number" id="docenas2" placeholder="DOCENAS HECHAS">
      </div>
      <div class="input-group">
        <input type="number" id="ritmo2" placeholder="% RITMO DESEADO (ej. 105, 85)">
      </div>
      <button class="action-btn" onclick="calcOpt2()">CALCULAR</button>

      <div class="result-box" id="res2">
        <div class="result-value" id="res2-time">0h 0m</div>
        <div class="result-detail" id="res2-detail">0 horas exactas</div>
      </div>
    </div>
  </div>

  <script>
    // Registro PWA Service Worker Inline
    if ('serviceWorker' in navigator) {
      const swContent = `
        self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
        self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
      `;
      const blob = new Blob([swContent], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob));
    }

    // Datos Frases
    const quotes = [
      { text: "Son las decisiones las que nos hacen ser quienes somos. Y siempre podemos optar por hacer lo correcto.", author: "Spiderman" },
      { text: "Tenemos que ser más grandes que lo que nos hace sufrir.", author: "Spiderman" },
      { text: "A veces la vida apesta, ¡pero siempre vale la pena vivirla!", author: "Spiderman" },
      { text: "¿Sabes qué es más genial que la magia? Matemáticas.", author: "Spiderman" },
      { text: "Aquel que ayuda a los demás, simplemente porque debe y porque es lo correcto, es sin duda un verdadero superhéroe.", author: "Spiderman" },
      { text: "Eres mucho más fuerte de lo que crees. Confía en mí.", author: "Spiderman" },
      { text: "Independientemente de lo que me depare esta vida nunca olvidaré estas palabras: un gran poder conlleva una gran responsabilidad. Esa es mi virtud y mi maldición.", author: "Spiderman" },
      { text: "Somos quienes elegimos ser... ¡Así que elige!", author: "Spiderman" },
      { text: "Lo más difícil de la vida es que no siempre se puede salvar a todos.", author: "Spiderman" },
      { text: "A veces, para hacer lo correcto, tienes que ser firme y renunciar a lo que más deseas. Incluso a tus sueños.", author: "Spiderman" }
    ];

    // Lógica PIN
    let currentPin = "";
    const targetPin = "7550822";

    function appendPin(num) {
      if (currentPin.length < 7) {
        currentPin += num;
        updatePinDisplay();
      }
    }

    function clearPin() {
      currentPin = "";
      updatePinDisplay();
    }

    function updatePinDisplay() {
      const display = document.getElementById("pin-display");
      display.textContent = "*".repeat(currentPin.length) || "------";
    }

    function checkPin() {
      if (currentPin === targetPin) {
        document.getElementById("auth-screen").style.display = "none";
        showRandomQuote();
      } else {
        alert("Clave incorrecta");
        clearPin();
      }
    }

    function showRandomQuote() {
      const random = quotes[Math.floor(Math.random() * quotes.length)];
      document.getElementById("quote-text").textContent = `"${random.text}"`;
      document.getElementById("quote-author").textContent = `- ${random.author}`;
      document.getElementById("quote-modal").style.display = "flex";
    }

    function closeQuote() {
      document.getElementById("quote-modal").style.display = "none";
    }

    // Navegación Pestañas
    function switchTab(tab) {
      if(tab === 1) {
        document.getElementById("opt1").style.display = "block";
        document.getElementById("opt2").style.display = "none";
        document.getElementById("tab1-btn").classList.add("active");
        document.getElementById("tab2-btn").classList.remove("active");
      } else {
        document.getElementById("opt1").style.display = "none";
        document.getElementById("opt2").style.display = "block";
        document.getElementById("tab2-btn").classList.add("active");
        document.getElementById("tab1-btn").classList.remove("active");
      }
    }

    // Fondos Cambiables
    function setBg(type) {
      if(type === 'dark') {
        document.body.style.backgroundImage = 'none';
        document.body.style.backgroundColor = '#0d0f17';
      } else if(type === 'neon') {
        document.body.style.backgroundImage = 'radial-gradient(circle at 50% 50%, #1f0010 0%, #001122 100%)';
      } else if(type === 'red') {
        document.body.style.backgroundImage = 'linear-gradient(135deg, #000000 0%, #4a0000 100%)';
      }
    }

    // Cálculo Opción 1: 100%
    function calcOpt1() {
      const meta = parseFloat(document.getElementById("meta1").value);
      const docenas = parseFloat(document.getElementById("docenas1").value);

      if(!meta || !docenas) return;

      const ritmo100 = meta / 11;
      const horasTotales = docenas / ritmo100;

      const horasEnteras = Math.floor(horasTotales);
      const decimales = horasTotales - horasEnteras;
      const minutos = Math.round(decimales * 60);

      document.getElementById("res1-time").textContent = `${horasEnteras}h ${minutos}m`;
      document.getElementById("res1-detail").textContent = `${horasTotales.toFixed(3)} horas (Ritmo 100%)`;
      document.getElementById("res1").style.display = "block";
    }

    // Cálculo Opción 2: Ritmo por % Eficiencia
    function calcOpt2() {
      const meta = parseFloat(document.getElementById("meta2").value);
      const docenas = parseFloat(document.getElementById("docenas2").value);
      const ritmoInput = parseFloat(document.getElementById("ritmo2").value);

      if(!meta || !docenas || !ritmoInput) return;

      const factorRitmo = ritmoInput / 100;
      const ritmo100 = meta / 11;
      
      const horasTotales = (docenas / ritmo100) / factorRitmo;

      const horasEnteras = Math.floor(horasTotales);
      const decimales = horasTotales - horasEnteras;
      const minutos = Math.round(decimales * 60);

      document.getElementById("res2-time").textContent = `${horasEnteras}h ${minutos}m`;
      document.getElementById("res2-detail").textContent = `${horasTotales.toFixed(3)} horas al ${ritmoInput}%`;
      document.getElementById("res2").style.display = "block";
    }
  </script>
</body>
</html>
